name: fintrox

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fintrox}
      POSTGRES_USER: ${POSTGRES_USER:-fintrox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrox_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fintrox-postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-fintrox} -d ${POSTGRES_DB:-fintrox}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  fintrox-postgres:
