name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Test & Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=fintrox;Username=fintrox;Password=fintrox_ci
      Jwt__Issuer: Fintrox
      Jwt__Audience: Fintrox.Client
      Jwt__SigningKey: fintrox-ci-signing-key-only-not-for-production-2026
      Jwt__AccessTokenMinutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: fintrox
          POSTGRES_USER: fintrox
          POSTGRES_PASSWORD: fintrox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrox -d fintrox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Fintrox.Server.sln

      - name: Build
        run: dotnet build Fintrox.Server.sln --configuration Release --no-restore --warnaserror

      - name: Test
        shell: bash
        run: |
          mapfile -t test_projects < <(find tests -type f -name '*Tests.csproj' 2>/dev/null | sort)

          if [ "${#test_projects[@]}" -eq 0 ]; then
            echo "No test projects found yet; skipping test execution."
            exit 0
          fi

          for project in "${test_projects[@]}"; do
            echo "Running tests: $project"
            dotnet test "$project" \
              --configuration Release \
              --no-restore \
              --logger "trx" \
              --results-directory TestResults
          done

      - name: Check EF model snapshot
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Fintrox.Infrastructure/Fintrox.Infrastructure.csproj
          --startup-project src/Fintrox.Api/Fintrox.Api.csproj
          --configuration Release
          --no-build

      - name: Apply migrations to PostgreSQL
        run: >
          dotnet ef database update
          --project src/Fintrox.Infrastructure/Fintrox.Infrastructure.csproj
          --startup-project src/Fintrox.Api/Fintrox.Api.csproj
          --configuration Release
          --no-build

      - name: List applied migrations
        run: >
          dotnet ef migrations list
          --project src/Fintrox.Infrastructure/Fintrox.Infrastructure.csproj
          --startup-project src/Fintrox.Api/Fintrox.Api.csproj
          --configuration Release
          --no-build
          --connection "$ConnectionStrings__DefaultConnection"

  container:
    name: Docker Build & Publish
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/viktor132607/fintrox.server
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
